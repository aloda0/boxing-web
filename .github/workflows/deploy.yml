name: Build & Deploy

on:
  # 1. При пуше кода в main (обновление сайта разработчиком)
  push:
    branches: [main]

  # 2. При публикации контента в Sanity (через вебхук)
  repository_dispatch:
    types: [sanity-publish]

  # 3. Ручной запуск из GitHub (кнопка Run workflow)
  workflow_dispatch:

# Новый запуск ждёт завершения текущего — частичный деплой исключён
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Upload to REG.RU
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
        run: npm run build

      - name: Deploy to REG.RU via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /www/boxing-hmao.ru/
          exclude: |
            **/.git*
            **/.git*/**
